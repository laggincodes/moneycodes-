<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Target Ring -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="24 12" opacity="0.6" />

  <!-- Middle Radar Ring -->
  <circle cx="256" cy="256" r="112" fill="none" stroke="#818cf8" stroke-width="8" opacity="0.8" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="120" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="392" x2="256" y2="456" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="56" y1="256" x2="120" y2="256" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <line x1="392" y1="256" x2="456" y2="256" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />

  <!-- Inner Lead Acquisition Target -->
  <circle cx="256" cy="256" r="54" fill="#4338ca" filter="url(#glow)" />
  <circle cx="256" cy="256" r="42" fill="#6366f1" />
  <circle cx="256" cy="256" r="22" fill="#f43f5e" />

  <!-- Radar Ping Pulse -->
  <path d="M 256,256 L 380,180 A 176 176 0 0 0 256,80 Z" fill="#6366f1" opacity="0.15" />
</svg>
